                        - generic [ref=e1055]:
                          - generic [ref=e1056]:
                            - paragraph [ref=e1057]: Privacy Notice
                            - paragraph [ref=e1058]
                            - paragraph [ref=e1059]: This Privacy Notice explains how Vertiv Holdings Co or its affiliate (“Vertiv”) processes personal data provided by you in your resume / curriculum vitae or cover letter and that is otherwise collected in connection with your job application and Vertiv’s job candidate review process.
                            - paragraph [ref=e1060]: Personal data processed
                            - paragraph [ref=e1061]: "We may collect, store, and use the following personal data:"
                            - paragraph [ref=e1062]: · Identifiers, including name, address, email address, telephone number, date and place of birth, job title, social security number, driver’s license number, passport number, and other similar identifiers;
                            - paragraph [ref=e1063]: · Financial information, including income, tax status, banking details, and insurance details;
                            - paragraph [ref=e1064]: · Professional or employment-related information, including job titles, performance evaluations, references from previous employers, and trade union membership;
                            - paragraph [ref=e1065]: · Education information, including training history;
                            - paragraph [ref=e1066]: · Personal data, including marital and parental status, criminal record checks, and health/medical information; and
                            - paragraph [ref=e1067]: · Protected classification information, including race, gender, ethnicity, religion, sexual orientation, citizenship, and residency.
                            - paragraph [ref=e1068]
                            - paragraph [ref=e1069]: References from previous employers may be requested and criminal records checks may be performed in compliance with applicable law.
                            - paragraph [ref=e1070]
                            - paragraph [ref=e1071]: Purposes of the processing
                            - paragraph [ref=e1072]: Each category of your personal data may be processed to evaluate your profile, attributes, and professional skills as part of Vertiv’s personnel selection process. Such processing is necessary to evaluate a working relationship between you and Vertiv and for Vertiv to comply with applicable law. The legal basis for processing your personal data is for Vertiv to take steps at your request prior to entering a potential employment relationship with you.
                            - paragraph [ref=e1073]
                            - paragraph [ref=e1074]: If your resume / curriculum vitae or cover letter contains special categories of personal data (e.g., gender, race, and ethnic data), you will need to provide specific written consent for Vertiv to process such data. Vertiv does not require such data and recommends that you do not include such data on your resume / curriculum vitae or cover letter. If you include such data and choose not to consent to have such data processed, then Vertiv might not proceed with your application.
                            - paragraph [ref=e1075]
                            - paragraph [ref=e1076]: Nature of providing personal data
                            - paragraph [ref=e1077]: Providing your personal data is required for the above purposes. Therefore, refusal to provide the requested data or its inaccuracy might prevent Vertiv from considering and evaluating your application.
                            - paragraph [ref=e1078]
                            - paragraph [ref=e1079]: Protection of personal data
                            - paragraph [ref=e1080]: Your personal data will be processed manually or electronically, using automated tools that ensure the security and confidentiality of the data. We will process only personal data necessary for the purposes described above. The individuals authorized to process personal data will immediately delete or make anonymous personal data unnecessary for the above purposes.
                            - paragraph [ref=e1081]
                            - paragraph [ref=e1082]: Your processed personal data are stored at our office or at the office of external providers we entrust to store personal data. If you wish to know the list of our external providers, please contact us.
                            - paragraph [ref=e1083]
                            - paragraph [ref=e1084]: Data retention period
                            - paragraph [ref=e1085]: Your personal data will be retained for the time period necessary to evaluate your candidacy for the position for which you applied and for a maximum of three years thereafter to evaluate your candidacy for any future positions at Vertiv that may become available, after which your personal data will be deleted or rendered anonymous. Please note that the retention period may be modified to comply with applicable law in your country of residence.
                            - paragraph [ref=e1086]
                            - paragraph [ref=e1087]: Disclosure of Personal Data
                            - paragraph [ref=e1088]: "Your personal data may be disclosed for business purposes and to the extent necessary for Vertiv to fulfil legal or regulatory obligations:"
                            - paragraph [ref=e1089]: · Personal data will be processed by Vertiv employees authorized to process personal data for the purposes described above.
                            - paragraph [ref=e1090]: · Personal data may be processed for business purposes by those authorized to maintain and develop Vertiv’s information technology systems, companies that provide computer and electronic or storage services, outsourcing service providers, consultants, and Vertiv affiliates.
                            - paragraph [ref=e1091]: · Personal data may be shared with government agencies, which may act as autonomous data controllers or data processors.
                            - paragraph [ref=e1092]: · Personal data may be transferred to other companies of the Vertiv group or third parties located in other countries, including the United States of America. In such cases, Vertiv will take appropriate measures to ensure appropriate safeguards are in place to protect your data.
                            - paragraph [ref=e1093]: · Personal data may be processed by external service providers entrusted with job candidate management, such as recruitment agencies. Vertiv will provide you with a list of such external service providers upon request.
                            - paragraph [ref=e1094]: · Personal data may be disclosed to previous employers to facilitate reference checks, subject to applicable law.
                            - paragraph [ref=e1095]
                            - paragraph [ref=e1096]: Vertiv does not sell your personal data for monetary or other valuable consideration.
                            - paragraph [ref=e1097]
                            - paragraph [ref=e1098]: Manage the processing of your personal data
                            - paragraph [ref=e1099]: "Vertiv is a global company with legal entities, business activities, management, and system infrastructure throughout the world and we are committed to safeguarding personal data in compliance with all applicable data privacy laws. If you are located in one of the regions, countries, or states listed below, please see the respective Privacy Notice to understand Vertiv’s compliance with the data privacy law in your location:"
                            - list [ref=e1100]:
                              - listitem [ref=e1101]:
                                - link "Europe (GDPR)" [ref=e1102] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/gdpr-privacy-statement/
                              - listitem [ref=e1103]:
                                - link "California" [ref=e1104] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/en-us/privacy-policy/privacy-notice-for-website-california/
                              - listitem [ref=e1105]:
                                - link "China" [ref=e1106] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/en-cn/cls-statement/
                              - listitem [ref=e1107]:
                                - link "Argentina" [ref=e1108] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/es-latam/about/ethics--compliance/politica-de-tratamiento-de-datos-personales/
                              - listitem [ref=e1109]:
                                - link "Colombia" [ref=e1110] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/es-latam/about/ethics--compliance/politica-de-tratamiento-de-datos-personales/
                              - listitem [ref=e1111]:
                                - link "Philippines" [ref=e1112] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/en-asia/privacy-policy/privacy-notice-for-company-website-for-philippines-users/
                              - listitem [ref=e1113]:
                                - link "Peru" [ref=e1114] [cursor=pointer]:
                                  - /url: https://www.vertiv.com/es-latam/about/ethics--compliance/politica-de-tratamiento-de-datos-personales-peru/
                            - paragraph [ref=e1115]: "Applicable data privacy law may provide you with certain rights with respect to your personal data, including the following:"
                            - paragraph [ref=e1116]: · The right to obtain confirmation of the existence or non-existence of personal data relating to you.
                            - paragraph [ref=e1117]: "· The right to be informed of the following:"
                            - paragraph [ref=e1118]: o the origin of the personal data processed
                            - paragraph [ref=e1119]: o the purpose and methods of data processing
                            - paragraph [ref=e1120]: o the logic applied to data processed electronically
                            - paragraph [ref=e1121]: o the identity of the data controller and data processors
                            - paragraph [ref=e1122]: o the identity of the individuals or categories of individuals with whom your personal data may be shared as appointed representatives of Vertiv in your country of residence or as individuals authorized to process your data
                            - paragraph [ref=e1123]: "· The right to:"
                            - paragraph [ref=e1124]: o have your personal data updated, corrected, and supplemented
                            - paragraph [ref=e1125]: o have the processing of your personal data restricted to the scope of the consent you gave by accepting this Privacy Notice
                            - paragraph [ref=e1126]: o have any unlawfully processed data erased, made anonymous, or blocked
                            - paragraph [ref=e1127]: o require a declaration attesting that the individuals/companies with whom we have shared your personal data have, upon your request, updated, corrected, and supplemented your data and/or restricted the processing of your data, unless doing so proved impossible or implied an effort that was clearly disproportionate to the right to be protected
                            - paragraph [ref=e1128]: o obtain, in a structured format commonly used and readable by electronic devices, the personal data you give us, and to have such data transmitted, directly or through Vertiv, to another data controller (known as data portability)
                            - paragraph [ref=e1129]: "· The right to object, in whole or in part, to:"
                            - paragraph [ref=e1130]: o the processing, on legitimate grounds, of your personal data, including data relevant for the purposes they were collected
                            - paragraph [ref=e1131]: o the processing of your personal data for profiling, to send you advertising material and direct sales messages, and to conduct market or commercial communication surveys
                            - paragraph [ref=e1132]
                            - paragraph [ref=e1133]: "To exercise your data privacy rights or to obtain more information, you may contact Vertiv at:"
                            - paragraph [ref=e1134]:
                              - text: "· By email at:"
                              - link "dataprotection@vertiv.com" [ref=e1135] [cursor=pointer]:
                                - /url: mailto:dataprotection@vertiv.com
                            - paragraph [ref=e1136]: "· By telephone at: 1 (800) 376-2127"
                            - paragraph [ref=e1137]: "· By mail at: Vertiv Group Corporation, Chief Compliance Officer, 1050 Dearborn Drive, Columbus, Ohio 43085"
                            - paragraph [ref=e1138]:
                              - text: "· If you are a resident of a country in Europe, you may contact our Data Protection Officer at:"
                              - link "dpo.vertiv@amicadpo.eu" [ref=e1139] [cursor=pointer]:
                                - /url: mailto:dpo.vertiv@amicadpo.eu
                              - text: .
                            - paragraph [ref=e1140]
                            - paragraph [ref=e1141]: If you believe that Vertiv or an individual/company with whom we have shared your personal data has violated your rights, you may file a complaint with the Data Protection Authority in your country and other competent supervisory authorities.
                            - paragraph [ref=e1142]
                            - paragraph [ref=e1143]: Additional notices
                            - paragraph [ref=e1144]: If you have difficulty accessing any material on this Privacy Notice because of a disability, please contact us in writing or by telephone and we will work with you to make the information available.
                            - paragraph [ref=e1145]
                            - paragraph [ref=e1146]: Vertiv is committed to offering equal opportunity to all individuals without discrimination on the basis of age, race, color, religion, creed, sex, pregnancy status (including childbirth, breastfeeding, or related medical conditions), marital status, sexual orientation, gender identity / expression (including transgender status or sexual stereotypes), genetic information, citizenship status, national origin, protected veteran status, political affiliation, or disability, or any other discrimination prohibited by applicable law.
